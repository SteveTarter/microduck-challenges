# The 2 m Roller Sprint: skate a flat 2 m lane on roller blades as fast as
# possible. The Arena races the policy at forward commands from 0.30 to 2.00 m/s
# and keeps its best.
event = "roller-sprint-2m"
task  = "Mjlab-RollerSprint2m-MicroDuck"
kind  = "perpetual"

[recipe]                  # the first training, as is
num_envs       = 2048
max_iterations = 6000
seed           = 10301

[params.speed_reward]     # skate3: now the forward_speed weight (was wheel_speed, 10.0)
label = "Forward speed reward"
value = 12.0
min   = 2.0
max   = 20.0

[params.upright_reward]   # skate4: 2.0 -> 1.0 (the sprint's), room to lean like the leader
label = "Stay upright"
value = 1.0
min   = 0.5
max   = 5.0
